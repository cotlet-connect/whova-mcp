[project]
name = "whova-mcp"
version = "1.1.0"
description = "Connect Whova to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Whova API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["whova", "whova api", "whova mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/whova-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=whova"
Source = "https://github.com/cotlet-connect/whova-mcp"

[project.scripts]
whova-mcp = "whova_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"whova_agent.py" = "whova_agent.py"

[tool.hatch.build.targets.sdist]
include = ["whova_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
